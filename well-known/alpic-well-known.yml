notes: >-
  api.alpic.ai advertises an OAuth 2.0 protected-resource + authorization-server pair.
  The authorization-server metadata carries a non-standard agent_auth block that points
  agents to a published auth skill (https://alpic.ai/auth.md) and a register_uri
  (https://api.alpic.ai/agent/auth) for programmatic (agentic) API-key registration via
  identity assertion (urn:ietf:params:oauth:token-type:id-jag). One of the two
  authorization servers listed on the protected-resource document is an Amazon Cognito
  user pool (cognito-idp.us-east-1.amazonaws.com).
