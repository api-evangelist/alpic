aid: alpic
name: Alpic
description: >-
  Alpic is the MCP-native cloud platform for building, deploying, monitoring, and distributing
  Model Context Protocol (MCP) servers and ChatGPT Apps. Its stack spans the open-source Skybridge
  TypeScript framework, the `alpic` CLI, Alpic Cloud (one-click deploy, multi-environment support,
  runtime and build logs, analytics, DCR proxy, Node.js/Python runtimes), Beacon compliance audits,
  and one-click distribution to the MCP registry. The Alpic REST API (https://api.alpic.ai, v1)
  programmatically manages teams, projects, environments, environment variables, deployments,
  analytics, playgrounds, tunnels, distribution, and Beacon audits, with an agentic self-registration
  path so AI agents can obtain an API key and ship MCP servers autonomously. Founded by the repeat
  team behind Streamroot; backed by Partech.
