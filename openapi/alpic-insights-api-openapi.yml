                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
    delete:
      operationId: intentCategories.delete.v1
      summary: Delete an intent category
      description: Delete an intent category; its intents are unlinked but not deleted
      tags:
      - Insights
      parameters:
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
          description: The ID of the environment
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          description: The ID of the category
      responses:
        '200':
          description: The intent category has been deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
