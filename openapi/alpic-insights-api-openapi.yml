  /v1/environments/{environmentId}/intent-categories/{categoryId}/link:
    post:
      operationId: intentCategories.link.v1
      summary: Link an intent category
      description: Link an intent category to intents; already linked intents are ignored
      tags:
      - Insights
      parameters:
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
          description: The ID of the environment
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          description: The ID of the category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intentIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    minLength: 1
                  description: IDs of the intents to categorize
              required:
              - intentIds
      responses:
        '200':
          description: The intents have been linked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                required:
