openapi: 3.2.0
info:
  title: Alpic Insights API
  version: 1.0.0
servers:
- url: https://api.alpic.ai
security:
- bearerAuth: []
tags:
- name: Insights
paths:
  /v1/environments/{environmentId}/intents:
    get:
      operationId: intents.list.v1
      summary: List intents
      description: List grouped user intents for an environment over a time range
      tags:
      - Insights
      parameters:
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
          description: The ID of the environment
      - name: since
        in: query
        schema:
          type: string
          default: 7d
          description: Start time — ISO 8601 (2024-01-01T00:00:00Z) or relative (1h, 30m, 2d)
        allowEmptyValue: true
        allowReserved: true
      - name: until
        in: query
        schema:
          type: string
          description: End time — ISO 8601 or relative
        allowEmptyValue: true
        allowReserved: true
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        allowEmptyValue: true
        allowReserved: true
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          default: 0
        allowEmptyValue: true
        allowReserved: true
      - name: search
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 200
        allowEmptyValue: true
        allowReserved: true
      - name: tools
        in: query
        schema:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
        style: deepObject
        explode: true
        allowEmptyValue: true
        allowReserved: true
      - name: clientIds
        in: query
        schema:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
        style: deepObject
        explode: true
        allowEmptyValue: true
        allowReserved: true
      - name: categoryIds
        in: query
        schema:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
        style: deepObject
        explode: true
        allowEmptyValue: true
        allowReserved: true
      - name: sortDir
        in: query
        schema:
          enum:
          - asc
          - desc
          type: string
          default: desc
        allowEmptyValue: true
        allowReserved: true
      responses:
        '200':
          description: The grouped user intents
          content:
            application/json:
              schema:
                type: object
                properties:
                  intents:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        intentIds:
                          type: array
                          minItems: 1
                          items:
                            type: string
                        environmentId:
                          type: string
                        message:
                          type: string
                        toolName:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                          x-native-type: date
                        occurrenceCount:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                          exclusiveMinimum: 0
                        clientName:
                          anyOf:
                          - type: string
                          - type: 'null'
                        clientId:
                          anyOf:
                          - type: string
                          - type: 'null'
                        categories:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              color:
                                enum:
                                - red
                                - orange
                                - yellow
                                - green
                                - blue
                                - purple
                                - pink
                                - gray
                                type: string
                            required:
                            - id
                            - name
                            - color
                      required:
                      - id
                      - intentIds
                      - environmentId
                      - message
                      - toolName
                      - createdAt
                      - occurrenceCount
                      - clientName
                      - clientId
                      - categories
                  totalCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                - intents
                - totalCount
        '400':
          description: '400'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: BAD_REQUEST
                    status:
                      const: 400
                    message:
                      type: string
                      default: Bad Request
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
        '404':
          description: '404'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: NOT_FOUND
                    status:
                      const: 404
                    message:
                      type: string
                      default: Not Found
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
  /v1/environments/{environmentId}/intent-categories:
    get:
      operationId: intentCategories.list.v1
      summary: List intent categories
      description: List intent categories for an environment, including how many intents each category is linked to
      tags:
      - Insights
      parameters:
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
          description: The ID of the environment
      responses:
        '200':
          description: The intent categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    color:
                      enum:
                      - red
                      - orange
                      - yellow
                      - green
                      - blue
                      - purple
                      - pink
                      - gray
                      type: string
                    intentCount:
                      type: integer
                      minimum: 0
                      maximum: 9007199254740991
                  required:
                  - id
                  - name
                  - color
                  - intentCount
        '400':
          description: '400'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: BAD_REQUEST
                    status:
                      const: 400
                    message:
                      type: string
                      default: Bad Request
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
        '404':
          description: '404'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: NOT_FOUND
                    status:
                      const: 404
                    message:
                      type: string
                      default: Not Found
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
    post:
      operationId: intentCategories.create.v1
      summary: Create an intent category
      description: Create an intent category, optionally linking it to existing intents
      tags:
      - Insights
      parameters:
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
          description: The ID of the environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: The category name
                color:
                  enum:
                  - red
                  - orange
                  - yellow
                  - green
                  - blue
                  - purple
                  - pink
                  - gray
                  type: string
                  description: The category color; derived from the name when omitted
                intentIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    minLength: 1
                  description: IDs of intents to link to the new category
              required:
              - name
      responses:
        '200':
          description: The created intent category
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                    x-native-type: date
                  environmentId:
                    type: string
                  name:
                    type: string
                  color:
                    enum:
                    - red
                    - orange
                    - yellow
                    - green
                    - blue
                    - purple
                    - pink
                    - gray
                    type: string
                required:
                - id
                - createdAt
                - environmentId
                - name
                - color
        '400':
          description: '400'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: BAD_REQUEST
                    status:
                      const: 400
                    message:
                      type: string
                      default: Bad Request
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
        '404':
          description: '404'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: NOT_FOUND
                    status:
                      const: 404
                    message:
                      type: string
                      default: Not Found
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
