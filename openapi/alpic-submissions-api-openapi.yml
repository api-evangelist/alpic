openapi: 3.2.0
info:
  title: Alpic Submissions API
  version: 1.0.0
servers:
- url: https://api.alpic.ai
security:
- bearerAuth: []
tags:
- name: Submissions
paths:
  /v1/submissions:
    post:
      operationId: submissions.create.v1
      summary: Create a submission package
      description: Create a submission package for an environment. Alpic reads the environment's live MCP server and prefills every field it can infer, so the response already carries the populated package. The environment must have a successful deployment and must not require authentication.
      tags:
      - Submissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                environmentId:
                  type: string
                  description: The ID of the environment to build the package from
                platform:
                  enum:
                  - chatgpt
                  - claudeai
                  type: string
                  description: 'The directory the package targets: `chatgpt` for the OpenAI App Directory, `claudeai` for the Anthropic MCP Directory'
              required:
              - environmentId
              - platform
      responses:
        '200':
          description: The created submission package, with its prefilled fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: BAD_REQUEST
                    status:
                      const: 400
                    message:
                      type: string
                      default: Bad Request
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
        '404':
          description: '404'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: NOT_FOUND
                    status:
                      const: 404
                    message:
                      type: string
                      default: Not Found
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
  /v1/projects/{projectId}/submissions:
    get:
      operationId: submissions.list.v1
      summary: List submission packages
      description: List the submission packages of a project, grouped by directory and most recently updated first, optionally narrowed to one environment or one directory
      tags:
      - Submissions
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: The ID of the project
      - name: environmentId
        in: query
        schema:
          type: string
          description: Filter by environment ID
        allowEmptyValue: true
        allowReserved: true
      - name: platform
        in: query
        schema:
          enum:
          - chatgpt
          - claudeai
          type: string
          description: 'The directory the package targets: `chatgpt` for the OpenAI App Directory, `claudeai` for the Anthropic MCP Directory'
        allowEmptyValue: true
        allowReserved: true
      responses:
        '200':
          description: The list of submission packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Submission'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: BAD_REQUEST
                    status:
                      const: 400
                    message:
                      type: string
                      default: Bad Request
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
        '404':
          description: '404'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: NOT_FOUND
                    status:
                      const: 404
                    message:
                      type: string
                      default: Not Found
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
  /v1/submissions/{submissionId}:
    get:
      operationId: submissions.get.v1
      summary: Get a submission package
      description: Get a submission package by ID, including its form data and the prefill it started from
      tags:
      - Submissions
      parameters:
      - name: submissionId
        in: path
        required: true
        schema:
          type: string
          description: The ID of the submission package
      responses:
        '200':
          description: The submission package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: BAD_REQUEST
                    status:
                      const: 400
                    message:
                      type: string
                      default: Bad Request
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
        '404':
          description: '404'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: NOT_FOUND
                    status:
                      const: 404
                    message:
                      type: string
                      default: Not Found
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
    put:
      operationId: submissions.update.v1
      summary: Update a submission package
      description: Update the form data of a submission package. Only the fields you send are changed; the rest are left as they are. Unknown field names are rejected rather than ignored, so a typo fails the call. `platform` must match the package's own platform.
      tags:
      - Submissions
      parameters:
      - name: submissionId
        in: path
        required: true
        schema:
          type: string
          description: The ID of the submission package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                platform:
                  anyOf:
                  - const: claudeai
                    description: 'The directory the package targets: `chatgpt` for the OpenAI App Directory, `claudeai` for the Anthropic MCP Directory'
                  - const: chatgpt
                    description: 'The directory the package targets: `chatgpt` for the OpenAI App Directory, `claudeai` for the Anthropic MCP Directory'
                formData:
                  anyOf:
                  - $ref: '#/components/schemas/ClaudeSubmissionFormDataUpdate'
                  - $ref: '#/components/schemas/ChatgptSubmissionFormDataUpdate'
              required:
              - platform
              - formData
      responses:
        '200':
          description: The updated submission package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: BAD_REQUEST
                    status:
                      const: 400
                    message:
                      type: string
                      default: Bad Request
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
        '404':
          description: '404'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: NOT_FOUND
                    status:
                      const: 404
                    message:
                      type: string
                      default: Not Found
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
components:
  schemas:
    ChatgptSubmissionFormData:
      type: object
      properties:
        logoLight:
          type: string
          description: Logo icon for light mode. Square PNG, no borders or rounded corners (clients apply circular cropping).
        logoDark:
          type: string
          description: Optional dark-mode logo icon. Square PNG, same specs as the light icon. Leave empty if the light icon also works on dark backgrounds.
        appName:
          type: string
          description: The name users will see in ChatGPT and in the Plugin Directory.
        tagline:
          type: string
        description:
          type: string
          description: Clear, engaging description highlighting what the plugin does and why people will love it. Appears publicly on the directory page. End it by naming the product categories or intents the plugin does NOT cover, so ChatGPT learns when not to route to it (define exclusions by absent categories or wrong intents, never by naming other brands).
        category:
          enum:
          - BUSINESS
          - COLLABORATION
          - DESIGN
          - DEVELOPER_TOOLS
          - EDUCATION
          - ENTERTAINMENT
          - FINANCE
          - FOOD
          - LIFESTYLE
          - NEWS
          - PRODUCTIVITY
          - SHOPPING
          - TRAVEL
          type: string
          description: Category from the OpenAI taxonomy.
        developerName:
          type: string
          description: Developer name shown publicly on the plugin's directory page.
        companyUrl:
          type: string
        supportChannel:
          type: string
        privacyPolicyUrl:
          type: string
        termsOfServiceUrl:
          type: string
        demoRecordingUrl:
          type: string
        appCommerceAndPurchasing:
          type: boolean
          description: 'Checkbox: ''My plugin links or directs users out of ChatGPT to make purchases.'' Defaults to false. Verify the plugin does not offer digital goods.'
        serverUrl:
          type: string
        authentication:
          enum:
          - No auth needed
          - OAuth 2.0
          type: string
          description: OAuth 2.0 or No auth. OAuth configuration is auto-discovered from the MCP server's metadata.
        tools:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              title:
                type: string
                description: Human-friendly name for the tool, used in the UI. If not provided, `name` will be used.
              description:
                type: string
              annotations:
                type: object
                properties:
                  readOnlyHint:
                    type: boolean
                  destructiveHint:
                    type: boolean
                  openWorldHint:
                    type: boolean
                  idempotentHint:
                    type: boolean
            required:
            - name
          description: List of tools exposed by the MCP server (auto-populated from the production server's manifest).
        toolJustifications:
          type: array
          items:
            type: object
            properties:
              toolName:
                type: string
              readOnlyJustification:
                type: string
                description: One sentence on what the tool reads and returns.
              openWorldJustification:
                type: string
                description: One sentence on whether the tool reaches external systems beyond your own service.
              destructiveJustification:
                type: string
                description: 'One sentence on whether the tool changes data. For a read-only tool, state the full triad: "No data is created, modified, or deleted."'
            required:
            - toolName
            - readOnlyJustification
            - openWorldJustification
            - destructiveJustification
            description: Per-tool justification of each MCP annotation value (one specific sentence per hint).
          description: Per-tool justification of `readOnlyHint`, `openWorldHint`, and `destructiveHint` annotation values. One short, specific sentence per hint describing what the tool actually does.
        skills:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
            required:
            - name
            description: A skill discovered on the MCP server, by name.
          description: Skills the server exposes over MCP (auto-populated from the production server's manifest). Left unset when the server does not advertise the skills extension, which is a different state from advertising it and exposing none.
        testCases:
          type: array
          items:
            type: object
            properties:
              scenario:
                type: string
              userPrompt:
                type: string
              toolTriggered:
                type: string
                description: The tool this prompt should invoke.
              expectedOutput:
                type: string
                description: What the user should see, including post-interaction behaviour where relevant.
        negativeTestCases:
          type: array
          items:
            type: object
            properties:
              scenario:
                type: string
              userPrompt:
                type: string
        screenshots:
          type: array
          items:
            type: object
            properties:
              prompt:
                type: string
              url:
                type: string
            required:
            - prompt
            - url
