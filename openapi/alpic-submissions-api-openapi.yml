            - prompt
            - url
        primaryUseCases:
          type: string
          description: 'Describe the main tasks users will accomplish with this connector, and include a few example prompts a user might

            type. These may be shown publicly but are primarily used for internal review — reviewers test your server using them.'
        connectionRequirements:
          type: string
          description: 'What accounts, permissions, or setup a user needs before connecting (e.g. ''Requires a paid Acme account with admin

            permissions''). If there are genuinely no special requirements, say so explicitly.'
        readWriteCapabilities:
          enum:
          - read_only
          - write_only
          - read_write
          type: string
          description: 'What your server can do:

            • ''read_only'': retrieves data but never modifies it.

            • ''write_only'': creates or modifies data but does not read it.

            • ''read_write'': both retrieves and modifies data (most common).'
        companyName:
          type: string
          description: The company or organization behind this connector — its legal name or publicly known product name.
        companyWebsite:
          type: string
        primaryContactName:
          type: string
          description: Full name of the person Anthropic should contact about this submission. Receives review feedback and follow-up questions.
        primaryContactEmail:
          type: string
        primaryContactRole:
          type: string
          description: The primary contact's role at the company (e.g. 'Engineer', 'Product Manager'). Optional.
        anthropicPointOfContact:
          type: string
          description: If you've been working with someone at Anthropic, their name or email. Optional, can expedite review.
        authentication:
          enum:
          - oauth_dcr
          - oauth_cimd
          - oauth_anthropic_creds
          - custom_connection
          - none
          type: string
          description: 'How users authenticate with your server:

            • ''oauth_dcr'': OAuth 2.0 + Dynamic Client Registration (RFC 7591) — clients register themselves.

            • ''oauth_cimd'': OAuth 2.0 + Client ID Metadata Document — a published client_id metadata document.

            • ''oauth_anthropic_creds'': OAuth 2.0 with Anthropic-held client credentials (a static client_id, and secret if needed).

            • ''custom_connection'': users supply their own URL or client details at connection time (e.g. Snowflake).

            • ''none'': no authentication (authless) — anyone can connect and call tools without credentials.'
        partialAuth:
          type: boolean
          description: Whether some tools return 401 and prompt for auth on demand while the server otherwise starts authless (partial auth).
        apiOwnership:
          enum:
          - first_party
          - proxied
          - third_party
          type: string
          description: 'How your connector relates to the API it calls:

            • ''first_party'': the MCP server calls your own production APIs.

            • ''proxied'': calls go to a third-party API you''re authorized to integrate (e.g. a Zapier-style integration).

            • ''third_party'': calls a third-party API you don''t control — typically blocks listing; explain in ''additionalNotes''.'
        personalHealthData:
          anyOf:
          - type: boolean
          - type: object
            properties:
              other:
                type: string
            required:
            - other
          description: 'Whether this connector accesses, processes, or stores personal health information.

            No → false, Yes → true, or { other: explanation } when it depends on configuration.'
        sponsoredContent:
          anyOf:
          - type: boolean
          - type: object
            properties:
              other:
                type: string
            required:
            - other
          description: 'Whether this connector surfaces sponsored, promoted, or advertising content (prohibited in directory connectors).

