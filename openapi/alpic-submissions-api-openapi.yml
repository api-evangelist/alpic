      type: object
      properties:
        serverUrl:
          type: string
        name:
          type: string
        slug:
          type: string
        oneLiner:
          type: string
        description:
          type: string
        categories:
          type: array
          items:
            enum:
            - Productivity
            - Communication
            - Data & Analytics
            - Development tools
            - Financial Services
            - Consumer Health
            - Health & Life Sciences
            - Media & Entertainment
            - Commerce & Shopping
            - Legal
            - Sales and marketing
            - Creative
            - Nonprofit
            - Education
            - Other
