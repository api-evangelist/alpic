  /v1/environments/{environmentId}/telemetry-destinations:
    get:
      operationId: telemetryDestinations.list.v1
      summary: List telemetry destinations
      description: List the OTLP destinations configured for an environment. Secret header values are never returned.
      tags:
      - Telemetry
      parameters:
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
          description: The ID of the environment
      responses:
        '200':
          description: The list of telemetry destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    signal:
                      enum:
                      - logs
                      - metrics
                      - traces
                      type: string
                    endpoint:
                      type: string
                      minLength: 1
                      maxLength: 2048
                    protocol:
                      enum:
                      - http/protobuf
                      - http/json
                      type: string
                    headers:
                      type: array
                      items:
                        anyOf:
                        - type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                              minLength: 1
                              maxLength: 128
                              pattern: ^[A-Za-z0-9!#$%&'*+\-.^_`|~]+$
                            value:
                              type: 'null'
                            isSecret:
                              const: true
                          required:
                          - id
                          - name
                          - value
                          - isSecret
                        - type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                              minLength: 1
                              maxLength: 128
                              pattern: ^[A-Za-z0-9!#$%&'*+\-.^_`|~]+$
                            value:
                              type: string
                              maxLength: 2048
                            isSecret:
                              const: false
                          required:
                          - id
                          - name
                          - value
                          - isSecret
                    status:
                      enum:
                      - active
                      - suspended
                      type: string
                    lastFailureReason:
                      anyOf:
                      - enum:
                        - credentials
                        - wrong-path
                        - wrong-protocol
                        - invalid-payload
                        - partial-rejection
                        - blocked-target
                        - timeout
                        - unreachable
                        - receiver-error
                        - unexpected-status
                        type: string
                      - type: 'null'
                    isScopedToIntentionalRequestsOnly:
                      type: boolean
                  required:
                  - id
                  - signal
                  - endpoint
                  - protocol
                  - headers
                  - status
                  - lastFailureReason
                  - isScopedToIntentionalRequestsOnly
