openapi: 3.2.0
info:
  title: Alpic Teams API
  version: 1.0.0
servers:
- url: https://api.alpic.ai
security:
- bearerAuth: []
tags:
- name: Teams
paths:
  /v1/teams:
    get:
      operationId: teams.list.v1
      summary: List teams
      description: List all teams for the authenticated user
      tags:
      - Teams
      responses:
        '200':
          description: The list of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
                      x-native-type: date
                    hasStripeAccount:
                      type: boolean
                  required:
                  - id
                  - name
                  - createdAt
                  - hasStripeAccount
        '400':
          description: '400'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: BAD_REQUEST
                    status:
                      const: 400
                    message:
                      type: string
                      default: Bad Request
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
  /v1/teams/{teamId}/usage:
    get:
      operationId: teams.getUsage.v1
      summary: Get team usage
      description: Get the MCP request usage of a team for its current billing window. A team that has made no request in the window reports zero.
      tags:
      - Teams
      parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          description: The ID of the team
      responses:
        '200':
          description: The current billing window usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  teamId:
                    type: string
                  plan:
                    anyOf:
                    - enum:
                      - pro
                      - business
                      - enterprise
                      type: string
                    - type: 'null'
                    description: The plan in force for the window, null on the Free plan
                  periodStart:
                    type: string
                    format: date-time
                    x-native-type: date
                    description: Start of the current billing window
                  periodEnd:
                    type: string
                    format: date-time
                    x-native-type: date
                    description: End of the current billing window
                  requestCount:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                    description: MCP requests settled during the current billing window
                  includedRequests:
                    anyOf:
                    - type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    - type: 'null'
                    description: Requests included in the plan for one window, null when the allowance is contract-specific
                required:
                - teamId
                - plan
                - periodStart
                - periodEnd
                - requestCount
                - includedRequests
        '400':
          description: '400'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: BAD_REQUEST
                    status:
                      const: 400
                    message:
                      type: string
                      default: Bad Request
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
        '404':
          description: '404'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    defined:
                      const: true
                    code:
                      const: NOT_FOUND
                    status:
                      const: 404
                    message:
                      type: string
                      default: Not Found
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
                - type: object
                  properties:
                    defined:
                      const: false
                    code:
                      type: string
                    status:
                      type: number
                    message:
                      type: string
                    data: {}
                  required:
                  - defined
                  - code
                  - status
                  - message
components:
  securitySchemes:
    bearerAuth:
      type: http
      description: Bearer token for authentication. Use an API key from the API Keys page in team settings, or an OAuth access token.
      scheme: bearer
