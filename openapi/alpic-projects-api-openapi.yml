                      - stdio
                      - sse
                      - streamablehttp
                      type: string
                    - type: 'null'
                  rootDirectory:
                    anyOf:
                    - type: string
                    - type: 'null'
                  buildCommand:
                    anyOf:
                    - type: string
                    - type: 'null'
                  buildOutputDir:
                    anyOf:
                    - type: string
                    - type: 'null'
                  installCommand:
                    anyOf:
                    - type: string
                    - type: 'null'
                  startCommand:
                    anyOf:
                    - type: string
                    - type: 'null'
                  createdAt:
                    type: string
                    format: date-time
                    x-native-type: date
                  productionEnvironment:
