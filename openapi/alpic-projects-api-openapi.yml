    post:
      operationId: projects.create.v1
      summary: Create a project
      description: Create a project for a team
      tags:
      - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId:
                  type: string
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                sourceRepository:
                  type: string
                branchName:
                  type: string
                  minLength: 1
                runtime:
                  enum:
                  - python3.13
                  - python3.14
                  - node22
                  - node24
                  type: string
                transport:
                  enum:
                  - stdio
                  - sse
                  - streamablehttp
                  type: string
                rootDirectory:
                  type: string
                settings:
                  type: object
                  properties:
                    installCommand:
                      type: string
                    buildCommand:
                      type: string
                    buildOutputDir:
                      type: string
                    startCommand:
                      type: string
                  default: {}
                environmentVariables:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                        minLength: 2
                        pattern: ^[a-zA-Z]([a-zA-Z0-9_])+$
                      value:
                        type: string
                        minLength: 1
                      isSecret:
                        type: boolean
                        default: false
                    required:
                    - key
                    - value
                  default: []
              required:
              - name
              - runtime
      responses:
        '200':
          description: The project has been created successfully
