                          type: string
                        name:
                          type: string
                        mcpServerUrl:
                          type: string
                        domains:
                          type: array
                          items:
                            type: object
                            properties:
                              domain:
                                type: string
                              status:
                                enum:
                                - ongoing
                                - deployed
                                - failed
                                type: string
                              createdAt:
                                type: string
