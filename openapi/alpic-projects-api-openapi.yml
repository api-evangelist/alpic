                  id:
                    type: string
                  name:
                    type: string
                  teamId:
                    type: string
                  sourceRepository:
                    anyOf:
                    - type: string
                    - type: 'null'
                  runtime:
                    enum:
                    - python3.13
                    - python3.14
                    - node22
                    - node24
                    type: string
                  transport:
                    anyOf:
