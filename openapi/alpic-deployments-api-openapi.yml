                  - message
  /v1/deployments/{deploymentId}/logs:
    get:
      operationId: deployments.getLogs.v1
      summary: Get deployment logs
      description: Get the logs for a deployment
      tags:
      - Deployments
      parameters:
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
          description: The ID of the deployment
      responses:
        '200':
          description: The deployment logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: string
                          format: date-time
                          x-native-type: date
                        content:
                          type: string
                  hasMoreLogs:
                    type: boolean
                required:
                - logs
                - hasMoreLogs
        '400':
          description: '400'
          content:
            application/json:
              schema:
                oneOf:
