  /v1/environments/{environmentId}/playground:
    get:
      operationId: playground.get.v1
      summary: Get playground configuration
      description: Get the playground configuration for an environment
      tags:
      - environments
      parameters:
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
          description: The ID of the environment
      responses:
        '200':
          description: The playground configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  isPlaygroundEnabled:
                    type: boolean
                  serverMetadata:
                    anyOf:
                    - type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        headers:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              description:
                                type: string
                              isRequired:
                                type: boolean
                              isSecret:
                                type: boolean
                            required:
                            - name
                            - description
                            - isRequired
                            - isSecret
                        examplePrompts:
                          type: array
                          items:
